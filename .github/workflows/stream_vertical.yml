name: 2. Stream Vertical

on:
  workflow_dispatch:
    inputs:
      start_offset:
        description: 'Start offset in seconds'
        required: false
        default: '0'

jobs:
  stream:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Download Video
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh run list --workflow=download.yml --status=success --limit=1 --json databaseId --jq '.[0].databaseId')
          gh run download $RUN_ID -n downloaded-video

      - name: Stream Vertical
        env:
          YOUTUBE_STREAM_KEY_VERTICAL: ${{ secrets.YOUTUBE_STREAM_KEY_VERTICAL }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO: ${{ github.repository }}
          START_OFFSET: ${{ github.event.inputs.start_offset }}
        run: python scripts/stream_vertical.py
