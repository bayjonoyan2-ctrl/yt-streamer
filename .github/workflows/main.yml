name: Huya to YouTube

on:
  workflow_dispatch: 
    inputs:
      action:
        description: 'Choose Download or Stream'
        required: true
        default: 'Download'
        type: choice
        options:
        - Download
        - Stream
      video_url:
        description: 'Paste Huya Video Link Here (Only for Download)'
        required: false
        default: 'https://www.huya.com/video/play/'
      start_offset:
        description: 'Time to start streaming from (in seconds)'
        required: false
        default: '0'

jobs:
  download:
    if: github.event.inputs.action == 'Download'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
        
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Run Downloader
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
          VOD_URL: ${{ github.event.inputs.video_url }}
        run: python download.py
        
      - name: Upload Video to Artifact
        uses: actions/upload-artifact@v4
        with:
          name: huya-video
          path: final_video.mp4
          retention-days: 3

  stream:
    if: github.event.inputs.action == 'Stream'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean

      - name: Download Video from Previous Run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh run list --workflow=main.yml --status=success --limit=1 --json databaseId --jq '.[0].databaseId')
          gh run download $RUN_ID -n huya-video

      - name: Sync Start Time
        env:
          START_OFFSET: ${{ github.event.inputs.start_offset }}
        run: |
          if [ "$START_OFFSET" != "0" ]; then
            echo "Triggered run detected. Waiting 15 minutes to connect exactly on time..."
            sleep 900
          fi

      - name: Run Stream
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          START_OFFSET: ${{ github.event.inputs.start_offset }}
        run: python stream.py
