name: Huya to YouTube

on:
  workflow_dispatch: 
    inputs:
      action:
        description: 'Choose Download or Stream'
        required: true
        default: 'Download'
        type: choice
        options:
        - Download
        - Stream

jobs:
  download:
    if: github.event.inputs.action == 'Download'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Downloader
        run: python download.py
      - name: Upload Video to Artifact
        uses: actions/upload-artifact@v4
        with:
          name: huya-video
          path: final_video.mp4
          retention-days: 1

  stream:
    if: github.event.inputs.action == 'Stream'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Video from Previous Run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh run list --workflow=main.yml --status=success --limit=1 --json databaseId --jq '.[0].databaseId')
          gh run download $RUN_ID -n huya-video

      - name: Run Stream
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: python stream.py
