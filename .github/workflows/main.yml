name: Huya to YouTube (Separated Streams)

on:
  workflow_dispatch: 
    inputs:
      action:
        description: 'Choose Action'
        required: true
        default: 'Download'
        type: choice
        options:
        - Download
        - Stream Horizontal
        - Stream Vertical
      video_url:
        description: 'Paste Huya Video Link Here'
        required: false
        default: 'https://www.huya.com/video/play/'
      schedule_hours:
        description: 'Start stream in N hours (0 = play now)'
        required: false
        default: '0'
      start_offset:
        description: 'Resume video from (seconds)'
        required: false
        default: '0'
  schedule:
    - cron: "*/10 * * * *"

jobs:
  download:
    if: github.event.inputs.action == 'Download'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Downloader
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
          VOD_URL: ${{ github.event.inputs.video_url }}
          SCHEDULE_HOURS: ${{ github.event.inputs.schedule_hours }}
        run: python download.py
      - name: Upload Video to Artifact
        uses: actions/upload-artifact@v4
        with:
          name: huya-video
          path: final_video.mp4
          retention-days: 3

  # HORIZONTAL STREAM JOB
  stream_horizontal:
    if: github.event.inputs.action == 'Stream Horizontal'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
      - name: Download Video from Previous Run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh run list --workflow=main.yml --status=success --limit=1 --json databaseId --jq '.[0].databaseId')
          gh run download $RUN_ID -n huya-video
      - name: Run Stream Horizontal
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          START_OFFSET: ${{ github.event.inputs.start_offset }}
        run: python stream.py

  # VERTICAL STREAM JOB
  stream_vertical:
    if: github.event.inputs.action == 'Stream Vertical'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
      - name: Download Video from Previous Run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh run list --workflow=main.yml --status=success --limit=1 --json databaseId --jq '.[0].databaseId')
          gh run download $RUN_ID -n huya-video
      - name: Run Stream Vertical
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY_VERTICAL }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          START_OFFSET: ${{ github.event.inputs.start_offset }}
        run: python stream.py

  scheduler:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run Scheduler
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python scheduler.py
