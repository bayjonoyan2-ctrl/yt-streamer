name: 1. Download Huya Video

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Huya Video URL'
        required: true
      schedule_horizontal_hours:
        description: 'Start Horizontal stream in N hours (0 = off)'
        required: true
        default: '0'
      schedule_vertical_hours:
        description: 'Start Vertical stream in N hours (0 = off)'
        required: true
        default: '0'

jobs:
  download_and_render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: 2. Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 4. Download Video from Huya
        env:
          VOD_URL: ${{ github.event.inputs.video_url }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          python -c "
          import os, subprocess, sys, re
          VOD_URL = os.environ.get('VOD_URL')
          PROXY_URL = os.environ.get('PROXY_URL')
          subprocess.run(['pip', 'install', '-q', 'yt-dlp'])
          subprocess.run(['wget', '-q', '-O', 'huya_crawler', 'https://github.com/hatienl0i2612/huya-crawler/releases/latest/download/huya_crawler-linux-amd64'])
          subprocess.run(['chmod', '+x', 'huya_crawler'])
          result = subprocess.run(['./huya_crawler', '-json', VOD_URL], capture_output=True, text=True)
          m3u8_match = re.search(r'(https?://[^\s\"\']+\.m3u8[^\s\"\']*)', result.stdout + result.stderr)
          if not m3u8_match: sys.exit(1)
          m3u8_url = m3u8_match.group(1)
          subprocess.run(['yt-dlp', '--add-header', 'Referer:https://v.huya.com/', '--add-header', 'User-Agent:Mozilla/5.0', '--extractor-args', f'generic:proxy={PROXY_URL}', '-N', '8', '-c', '--fixup', 'force', '--retries', 'infinite', '--fragment-retries', 'infinite', '-o', 'video.mp4', m3u8_url])
          "

      - name: 5. Render Vertical Video (720x1280 ULTRA FAST)
        run: |
          ffmpeg -y -fflags +genpts -i video.mp4 -loop 1 -i bg.png \
          -filter_complex "[1:v]scale=720:1280[bg]; \
          [0:v]crop=1420:920:0:45,scale=720:-2[game]; \
          [0:v]crop=360:320:1550:650,scale=540:-2[cam]; \
          [bg][cam]overlay=(W-w)/2:100[bg_cam]; \
          [bg_cam][game]overlay=0:640[out]" \
          -map "[out]" -map "0:a" \
          -c:v libx264 -preset ultrafast -tune fastdecode -b:v 3M -maxrate 3M -bufsize 6M \
          -c:a aac -b:a 128k -shortest vertical_render.mp4

      - name: 6. Write Schedules
        env:
          HORIZONTAL_HOURS: ${{ github.event.inputs.schedule_horizontal_hours }}
          VERTICAL_HOURS: ${{ github.event.inputs.schedule_vertical_hours }}
        run: |
          python -c "
          from datetime import datetime, timedelta, timezone
          import os
          now = datetime.now(timezone.utc)
          h = float(os.environ.get('HORIZONTAL_HOURS', '0') or '0')
          v = float(os.environ.get('VERTICAL_HOURS', '0') or '0')
          if h >= 0: open('schedule_horizontal.txt', 'w').write((now + timedelta(hours=h)).strftime('%Y-%m-%dT%H:%M:%SZ'))
          if v >= 0: open('schedule_vertical.txt', 'w').write((now + timedelta(hours=v)).strftime('%Y-%m-%dT%H:%M:%SZ'))
          "

      - name: 7. Commit Schedule Files
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add schedule_*.txt || true
          git commit -m "Update stream schedules" || true
          git push || true

      - name: 8. Upload Horizontal Video to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: horizontal-video
          path: video.mp4
          retention-days: 3

      - name: 9. Upload Vertical Video to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vertical-video
          path: vertical_render.mp4
          retention-days: 3
